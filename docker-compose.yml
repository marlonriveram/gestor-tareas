version: '3.8'

services:

  postgres:
    image: postgres:16
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_DB: gestor_tareas
      POSTGRES_USER: marlon
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - backend

  backend:
    build: .
    container_name: gestor-tareas-app
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/gestor_tareas
      DB_USERNAME: marlon
      DB_PASSWORD: 1234

volumes:
  postgres_data:

networks:
  backend: